<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/proximastruc.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ProximaStruc — project control for construction sites: schedule, quality, materials, WSH and site records." />
    <meta name="theme-color" content="#14202b" />
    <!-- Installed app (Add to Home Screen). The default status bar is opaque and the app starts below it;
         black-translucent is avoided because iOS 26 lays such apps out one status bar short (WebKit 301108). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ProximaStruc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Keep dates, references and quantities as plain text rather than auto-detected phone/date links. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>ProximaStruc</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
