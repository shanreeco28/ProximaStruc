name: Desktop

# Builds the ProximaStruc desktop app (a frameless Tauri window around the live site).
# Run it from the Actions tab, then download the installer from the run's Artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri CLI
        run: npm install

      - name: Generate app icons from the site icon
        run: npm run icons

      - name: Build installer
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: proximastruc-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
