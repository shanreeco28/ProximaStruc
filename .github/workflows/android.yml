name: Android (Google Play)

# Builds the ProximaStruc Android App Bundle (.aab) for Google Play.
# Download it from the run's "Artifacts" section and upload it in Play Console.
# Signing uses the upload key stored in repository secrets (see docs/google-play.md).

on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check site address
        run: |
          if grep -q "REPLACE_WITH_YOUR_DOMAIN" app/build.gradle; then
            echo "::warning file=android/app/build.gradle::hostName is still a placeholder. Set it to the live ProximaStruc domain before uploading to Google Play."
          fi

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the bundle is unsigned. Google Play only accepts a signed bundle."
          fi

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: proximastruc-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
