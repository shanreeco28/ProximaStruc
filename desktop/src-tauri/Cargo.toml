[package]
name = "proximastruc-desktop"
version = "0.1.0"
description = "ProximaStruc desktop window"
edition = "2021"

[lib]
name = "proximastruc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
